<!-- Auth modal -->
<div class="auth-overlay" id="auth-overlay" onclick="if(event.target===this)closeAuth()">
  <div class="auth-card">
    <button class="auth-close" onclick="closeAuth()" aria-label="Close">&times;</button>
    <h2 class="auth-title" id="auth-title">Start your free trial</h2>
    <p class="auth-sub" id="auth-sub">14 days free · No credit card required</p>

    <form id="auth-form" onsubmit="submitAuth(event)">
      <div class="auth-field" id="name-field">
        <label class="auth-label" for="auth-name">Full name</label>
        <input class="auth-input" type="text" id="auth-name" autocomplete="name">
      </div>
      <div class="auth-field">
        <label class="auth-label" for="auth-email">Email</label>
        <input class="auth-input" type="email" id="auth-email" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label class="auth-label" for="auth-password">Password</label>
        <input class="auth-input" type="password" id="auth-password" required
               autocomplete="current-password" minlength="6">
      </div>
      <button class="auth-submit" type="submit" id="auth-submit">Create account</button>
    </form>

    <div class="auth-msg" id="auth-msg" role="status"></div>

    <div class="auth-switch" id="auth-switch">
      Already have an account? <a onclick="setMode('signin')">Sign in</a>
    </div>
    <button class="auth-forgot" id="auth-forgot" onclick="sendReset()" style="display:none;">
      Forgot your password?
    </button>

    <p style="font-size:11px; color:var(--text3); line-height:1.6; margin-top:18px; text-align:center;">
      By continuing you agree to our <a href="/terms" style="color:var(--text3); text-decoration:underline;">Terms</a> and <a href="/privacy" style="color:var(--text3); text-decoration:underline;">Privacy Policy</a>.
    </p>
  </div>
</div>
